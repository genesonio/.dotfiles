set -g status-left-length 20
set -s escape-time 0
set -g base-index 1
set -g set-clipboard on

set-option -g default-shell /bin/zsh
set-window-option -g mode-keys vi
set-option -g history-limit 10000

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -gq status-utf8 on
set -gq utf8 on

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'

bind f run-shell "tmux neww ~/.scripts/tmux-session-fzf"

# Tokyo Night, matching kitty.conf. Default bg keeps kitty's transparency (explicit colors render opaque)
set -g status-style "bg=default,fg=#787c99"
set -g status-left "#[fg=#bb9af7,bold] #S "
set -g status-right "#[fg=#787c99] %H:%M "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "
set -g window-status-separator ""
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#3d59a1"
set -g pane-border-status bottom
set -g pane-border-format ""
set -g pane-border-lines single
set -g message-style "bg=default,fg=#7dcfff"
set -g mode-style "bg=#28344a"
